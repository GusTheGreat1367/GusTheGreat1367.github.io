<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Github user search web application</title>
</head>
<body>
  <input type="search", placeholder="Search a Github user/repo...", id="GHsearch">
  <button onclick="submit()">Search in <strong>users</strong></button>
  <button onclick="RepoSub()">Search in <strong>repos</strong></button>
</body>
<script>
    var search = document.getElementById("GHsearch");
    function submit(search){
        if(!(search === ("" || " "))) {
            var tab = 'api.github.com/search/users?q=' + string(search); 
            window.location.href = tab; //doesn't work on a file because it tries to acces the website on the file, not on WWW.
        }
        else {
            alert("Field cannot be whitespace or null!");
        }
    }
  //for both: display results on page, doesn't switch tabs, meaning  DOESN'T WORK
  function RepoSub(search){
    if(!(search === ("" || " "))) {
      var tab = 'https://api.github.com/search/repositories?q=' + string(search);
      window.location.href = tab;
    }
  }
</script>

</html>
