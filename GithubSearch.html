<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Github user search web application</title>
</head>

<body>
  <input type="search", placeholder="Search in Github...", id="GHsearch">
  <a class="link" href="" target="_blank">
    <button onclick="submit()">Search in <strong>users</strong></button>
    <button onclick="RepoSub()">Search in <strong>repos</strong></button>
  </a>
</body>
<script>
  var search = document.getElementById("GHsearch");
  var tab = document.getElementById("link");
    function submit(search){
        if(!(search === ("" || " "))) {
            tab.href = 'api.github.com/search/users?q=' + string(search); 
    
        }
        else {
            alert("Field cannot be whitespace or null!");
        }
    }
  //for both: display results on page, doesn't switch tabs, meaning  DOESN'T WORK
  function RepoSub(search){
    if(!(search === ("" || " "))) {
      tab.href = 'https://api.github.com/search/repositories?q=' + string(search);
    }else {
      alert("Field cannot by whitespace or null!");
    }
  }
</script>

</html>
